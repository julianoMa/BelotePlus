{% extends "base.html" %}

{% set title_key = "page_title_ranking" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/ranking.css') }}">
{% endblock %}

{% block content %}
<div class="leaderboard panel">
    {% for i in ranking %}
    <div class="rank-card">
        <span class="rank-position"><span>{{ t.position }}</span> n°{{ loop.index }}</span>
        <span class="rank-team"><span>{{ t.team }}</span> n°{{ i[0] }}</span>
        <span class="rank-points">{{ i[1] }} points</span>
    </div>
    {% endfor %}
</div>
{% endblock %}

{% extends "base.html" %}

{% set title_key = "page_title_new" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/new-tournament.css') }}">
{% endblock %}

{% block content %}
<div class="page narrow">
    <h1 class="page-title">{{ t.new_tournament_title }}</h1>

    <form method="POST" action="/new-tournament" class="panel new-form">
        <div class="field">
            <label class="form-label" for="tournament-name">{{ t.input_tournament_name }}</label>
            <input class="input" type="text" name="tournament_name" id="tournament-name" maxlength="60" autocomplete="off" required autofocus>
        </div>

        <div class="field-row">
            <div class="field">
                <label class="form-label" for="round-number">{{ t.input_rounds_number }}</label>
                <input class="input" type="number" inputmode="numeric" min="1" name="rounds_number" id="round-number" required>
            </div>

            <div class="field">
                <label class="form-label" for="table-number">{{ t.input_tables_number }}</label>
                <input class="input" type="number" inputmode="numeric" min="1" name="table_number" id="table-number" required>
            </div>
        </div>

        <p class="hint">{{ t.tables_hint }}</p>

        <div class="form-actions">
            <button type="submit" class="button button-primary">{{ t.create_tournament_button }}</button>
        </div>
    </form>
</div>
{% endblock %}
